<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 챗봇</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Markdown and Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="icon-btn" id="sidebar-toggle-btn" title="사이드바 접기/펼치기" aria-label="메뉴">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <button class="new-chat-btn" id="new-chat-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>새 대화</span>
        </button>
      </div>

      <div class="sidebar-content">
        <div class="sidebar-section-title">최근 대화</div>
        <ul class="chat-history-list" id="chat-history-list">
          <!-- Dynamic chat sessions populated here -->
        </ul>
      </div>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <span class="status-dot online"></span>
          <span class="status-text" id="api-status-text">Gemini API 연동됨</span>
        </div>
        <div class="model-badge-info" id="sidebar-model-badge">
          Gemini 3.8 Flash
        </div>
      </div>
    </aside>

    <!-- Main Container -->
    <main class="main-container">
      <!-- Top Navigation Bar -->
      <header class="top-nav">
        <div class="top-nav-left">
          <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn" title="메뉴 열기">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="brand-logo">
            <span class="brand-text">Gemini</span>
            <span class="brand-sub" id="nav-model-tag">3.8 Flash</span>
          </div>
        </div>

        <div class="top-nav-right">
          <!-- Top Model Selector Dropdown -->
          <div class="top-model-selector-wrapper">
            <button class="top-model-btn" id="top-model-btn" aria-haspopup="true" aria-expanded="false">
              <span class="model-sparkle">✦</span>
              <span id="current-model-display">Gemini 3.8 Flash</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="model-dropdown-menu" id="model-dropdown-menu">
              <div class="dropdown-header">AI 모델 선택</div>
              <button class="model-option active" data-model="gemini-3.8-flash">
                <div class="model-opt-info">
                  <div class="model-opt-name">Gemini 3.8 Flash <span class="badge-pill">기본 / 최신</span></div>
                  <div class="model-opt-desc">최신 차세대 플래시 모델 · 최고 속도 및 고지능</div>
                </div>
                <div class="model-opt-check">✓</div>
              </button>
              <button class="model-option" data-model="gemini-3.7-flash">
                <div class="model-opt-info">
                  <div class="model-opt-name">Gemini 3.7 Flash <span class="badge-pill secondary">선택 가능</span></div>
                  <div class="model-opt-desc">검증된 고속 멀티모달 플래시 모델</div>
                </div>
                <div class="model-opt-check">✓</div>
              </button>
              <div class="dropdown-footer">단축키: Ctrl + Shift + M</div>
            </div>
          </div>
        </div>
      </header>

      <!-- Chat Scroll Area -->
      <div class="chat-viewport" id="chat-viewport">
        <!-- Hero Section (Visible when no messages) -->
        <div class="hero-section" id="hero-section">
          <h1 class="hero-title">살펴보고자 하는 새로운 아이디어가 있나요?</h1>
          <p class="hero-subtitle">최신 Gemini 3.8 Flash와 3.7 Flash 모델로 무엇이든 질문하고 창작해보세요.</p>

          <!-- In home mode, input-area-wrapper is placed here directly under the title -->
          <div class="hero-input-slot" id="hero-input-slot"></div>

          <div class="suggestion-chips-grid" id="suggestion-chips-grid">
            <button class="suggestion-chip" data-prompt="GCP Compute Engine을 사용한 웹 서비스 구축 가이드 및 핵심 장점을 알려줘.">
              <div class="chip-icon">☁️</div>
              <div class="chip-text">
                <strong>GCP Compute Engine</strong>
                <span>인프라 구축 가이드 & 장점</span>
              </div>
            </button>
            <button class="suggestion-chip" data-prompt="Python과 JavaScript를 비교하고 각 언어의 주요 활용 분야를 표로 정리해줘.">
              <div class="chip-icon">⚡</div>
              <div class="chip-text">
                <strong>프로그래밍 언어 비교</strong>
                <span>Python vs JavaScript 핵심 정리</span>
              </div>
            </button>
            <button class="suggestion-chip" data-prompt="인공지능 챗봇 서비스 런칭을 위한 창의적이고 참신한 마케팅 아이디어 5가지 제안해줘.">
              <div class="chip-icon">💡</div>
              <div class="chip-text">
                <strong>아이디어 기획</strong>
                <span>AI 챗봇 런칭 마케팅 아이디어</span>
              </div>
            </button>
            <button class="suggestion-chip" data-prompt="간단한 주식 포트폴리오 관리 웹 애플리케이션의 아키텍처 설계를 작성해줘.">
              <div class="chip-icon">💻</div>
              <div class="chip-text">
                <strong>아키텍처 설계</strong>
                <span>웹 애플리케이션 구조 제안</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Messages Flow Container -->
        <div class="messages-container" id="messages-container"></div>
      </div>

      <!-- Bottom Floating Input Area Container -->
      <div class="bottom-input-slot" id="bottom-input-slot">
        <div class="input-area-wrapper" id="input-area-wrapper">
          <!-- Attachment Previews -->
          <div class="attachment-preview-bar" id="attachment-preview-bar" style="display: none;">
            <!-- dynamic attachment items -->
          </div>

        <!-- Main Pill Search/Input Box -->
        <div class="pill-input-box" id="pill-input-box">
          <!-- Left Action Button: + or X -->
          <div class="action-popup-wrapper">
            <button class="pill-action-btn" id="pill-action-btn" aria-label="도구 및 파일 업로드 메뉴" title="도구 메뉴 열기">
              <svg id="plus-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <svg id="close-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display: none;">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>

            <!-- Gemini Action Menu Popup (Exactly matching user screenshot) -->
            <div class="gemini-action-menu" id="gemini-action-menu">
              <!-- Item: 파일 업로드 -->
              <button class="action-menu-item" id="menu-upload-file">
                <div class="menu-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                  </svg>
                </div>
                <span class="menu-item-label">파일 업로드</span>
              </button>

              <!-- Item: Drive에서 파일 추가 -->
              <button class="action-menu-item" id="menu-drive-file">
                <div class="menu-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2.5 17h19"></path>
                    <path d="M12 2l9.5 15H2.5L12 2z"></path>
                  </svg>
                </div>
                <span class="menu-item-label">Drive에서 파일 추가</span>
              </button>

              <!-- Item: 업로드 더보기 -->
              <button class="action-menu-item" id="menu-upload-more">
                <div class="menu-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <circle cx="19" cy="12" r="1.5"></circle>
                    <circle cx="5" cy="12" r="1.5"></circle>
                  </svg>
                </div>
                <span class="menu-item-label">업로드 더보기</span>
                <span class="menu-item-arrow">›</span>
              </button>

              <div class="menu-divider"></div>

              <!-- Item: 이미지 만들기 -->
              <button class="action-menu-item" id="menu-create-image">
                <div class="menu-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                  </svg>
                </div>
                <span class="menu-item-label">이미지 만들기</span>
              </button>

              <!-- Item: 동영상 만들기 -->
              <button class="action-menu-item" id="menu-create-video">
                <div class="menu-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="M10 8l6 4-6 4V8z"></path>
                  </svg>
                </div>
                <span class="menu-item-label">동영상 만들기</span>
              </button>

              <!-- Item: 음악 만들기 -->
              <button class="action-menu-item" id="menu-create-music">
                <div class="menu-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                  </svg>
                </div>
                <span class="menu-item-label">음악 만들기</span>
              </button>

              <!-- Item: Canvas -->
              <button class="action-menu-item" id="menu-canvas">
                <div class="menu-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                  </svg>
                </div>
                <span class="menu-item-label">Canvas</span>
              </button>

              <!-- Item: 실시간 인터넷 검색 토글 -->
              <button class="action-menu-item" id="menu-toggle-websearch">
                <div class="menu-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                  </svg>
                </div>
                <span class="menu-item-label">실시간 인터넷 검색</span>
                <span class="menu-search-toggle-badge" id="menu-search-badge">켬</span>
              </button>

              <!-- Item: 도구 더보기 -->
              <button class="action-menu-item" id="menu-tools-more">
                <div class="menu-item-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <circle cx="19" cy="12" r="1.5"></circle>
                    <circle cx="5" cy="12" r="1.5"></circle>
                  </svg>
                </div>
                <span class="menu-item-label">도구 더보기</span>
                <span class="menu-item-arrow">›</span>
              </button>
            </div>
          </div>

          <!-- Central Auto-resizing Text Input -->
          <div class="input-field-container">
            <textarea 
              id="chat-input" 
              placeholder="Gemini에게 물어보기" 
              rows="1" 
              autocomplete="off"
              spellcheck="false"
            ></textarea>
          </div>

          <!-- Right Controls -->
          <div class="pill-right-controls">
            <!-- Real-time Web Search Toggle Button -->
            <button class="pill-search-btn active" id="pill-search-btn" title="실시간 웹 검색 활성화됨 (Google Search Grounding)" aria-label="실시간 웹 검색 토글">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
              <span class="search-active-dot"></span>
            </button>

            <!-- Model Switcher Pill Button with Tooltip (^⇧M) -->
            <div class="model-pill-wrapper">
              <button class="model-pill-btn" id="model-pill-btn" title="모델 변경 (^⇧M)">
                <span id="model-pill-text">Flash</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>
              <!-- Black floating tooltip exactly as seen in screenshot -->
              <div class="custom-tooltip" id="model-pill-tooltip">모델 변경 (^⇧M)</div>
            </div>

            <!-- Speech Microphone Button -->
            <button class="pill-mic-btn" id="pill-mic-btn" title="음성으로 입력하기" aria-label="음성 입력">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>

            <!-- Send Button -->
            <button class="pill-send-btn" id="pill-send-btn" title="메시지 보내기" aria-label="보내기" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Hidden File Input for Real File Uploads -->
        <input type="file" id="real-file-input" multiple style="display: none;" accept="image/*,text/*,.pdf,.json,.csv,.py,.js,.html,.css,.md">

        <!-- Legal Disclaimer / Privacy Notice -->
        <div class="input-subtext">
          Gemini는 실수를 할 수 있습니다. 민감한 정보는 입력하지 마시고 중요한 정보는 직접 다시 확인하세요.
        </div>
      </div>
    </div>
  </main>
  </div>

  <!-- Canvas Side Drawer Modal (Optional interactive feature) -->
  <div class="canvas-drawer" id="canvas-drawer">
    <div class="canvas-header">
      <div class="canvas-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        <span>Gemini Canvas</span>
      </div>
      <button class="icon-btn" id="close-canvas-btn">✕</button>
    </div>
    <div class="canvas-body">
      <textarea id="canvas-content" placeholder="이곳에서 코드, 기획서, 메모를 자유롭게 작성하거나 Gemini의 출력을 편집할 수 있습니다..."></textarea>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
